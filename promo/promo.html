  const pill = n => [L.fo[0] + L.pre - 1, L.fo[1] - 3, L.typedW[SLASH + n] - L.pre + 10, 32, 8];
  L.rows = rows.map(r => wp(r));

  const dotR = [dot[0], dot[1], dot[2], dot[3], 8];
  const dc = ctr(dot);
  const ER = 150, ecy = dot[1] + dot[3] - 62;

    [1.0, dotR, SP(20, 0.8)],
    [1.5, [dc[0] - ER / 2 + 20, ecy - ER / 2, ER, ER, 30], SP(22, 0.82)],
    [1.6, [L.h2[0] - ER - 10, ecy - ER / 2, ER, ER, 30], EX(0.4)],
    [2.0, [chip[0], chip[1], 42, 42, 10], EX(0.46)],
    [3.0, [chip[0] + 2, chip[1] + 2, 38, 38, 9], dt => Math.sin(Math.PI * clamp(dt / 0.16))],
    [5.0, [panel[0], panel[1], panel[2], panel[3], 16], SP(18, 0.85)],
    [5.42, [...L.tiles[0], 12], SP(18, 0.82)],
    [6.0, [...L.tiles[1], 12]],
    [6.5, [...L.tiles[5], 12]],
    [7.0, [...L.tiles[6], 12]],
    [7.56, caret(0), EX(0.42)],
  ];
  for (let i = 0; i < SLASH; i++) OBJ.push([TYPE_T0 + i * TYPE_DT, caret(L.typedW[i + 1]), STEP]);
  for (let n = 1; n <= TYPED.length - SLASH; n++) OBJ.push([TYPE_T0 + (SLASH + n - 1) * TYPE_DT, pill(n), n === 1 ? SP(26, 0.85) : SP(30, 0.9)]);
  OBJ.push([10.0, caret(L.fixedW), SP(18, 0.85)]);
  OBJ.push([11.0, [scr[0], scr[1], scr[2], scr[3], 44], EX(0.32)]);
  const r1 = ctr(L.rows[1]);
  OBJ.push([11.32, [r1[0], r1[1], 0, 0, 0], SP(16, 0.85)]);
  OBJ.push([24.5, [EC - 158, 222, 316, 316, 158], EX(0.52)]);

  const P = t => Math.pow(1.04, sceneS(t));
  const cam = (t0, d, cx, cy, z) => [t0, [cx, cy, Math.log(z / P(t0 + d))], EX(d)];
  CAM = [
    [0, [960, 540, 0]],
    cam(2.0, 0.62, 1035, 600, 1.5),
    cam(5.0, 0.56, 995, 790, 1.6),
    cam(8.0, 0.56, 944, 640, 1.75),
    cam(11.0, 0.5, 1035, 540, 1.1),
    cam(13.45, 0.6, 1000, 470, 1.22),
    cam(15.85, 0.6, 1000, 600, 1.2),
    cam(18.3, 0.6, 1020, 540, 1.12),
    cam(22.0, 0.6, 1000, 520, 1.2),
    cam(23.3, 0.7, 654, 540, 0.38),
    cam(24.5, 0.6, EC, 560, 1.0),
  ];
  const c = r => ctr(r);
  const sp = wp(keys.find(k => k.dataset.k === ' '));

  CUR = [
    [0, [1500, 1180]],
    mv(2.42, c(chip), 0.55),
    mv(3.9, c(wp(tIcon[2]))),
    mv(5.5, c(L.tiles[1])),
    mv(6.08, c(L.tiles[5]), 0.36),
    mv(6.58, c(L.tiles[6]), 0.36),
    mv(7.08, c(wp(abc)), 0.38),
    mv(7.85, [980, 900], 0.5),
    mv(9.5, [sp[0] + sp[2] * 0.55, sp[1] + sp[3] / 2], 0.46),
    mv(10.45, [960, 300], 0.6),
    mv(11.52, [L.rows[1][0] + 300, L.rows[1][1] + 50], 0.45),
    mv(14.3, [scr[0] + 98 * K, scr[1] + 149 * K], 0.5),
    mv(16.5, [scr[0] + 398 * K, scr[1] + 557 * K], 0.5),
    mv(18.9, [scr[0] + 250 * K, scr[1] + 520 * K], 0.6),
    mv(22.3, [scr[0] + 99 * K, scr[1] + 304 * K], 0.5),
    mv(23.15, [scr[0] + 900, scr[1] + 1300], 0.5),

function sceneS(t) {

}

}
const objAt = t => track(t, OBJ);
const show = (el, on) => el.style.visibility = on ? 'inherit' : 'hidden';

window.seek = function (t) {

  const vx = Math.abs(cx - px) * z, vy = Math.abs(cy - py) * z;

  setLine(H2, t, 0.5);

  show(hook, t < 2.3);

  const rr = 1150 * Math.pow(eout((t - 2.1) / 0.62), 1);
  show(phone, t >= 2.1);
  phone.style.clipPath = `circle(${rr}px at ${L.chip[0] - PH.x + 21}px ${L.chip[1] - PH.y + 21}px)`;

  // field text
  const fY = (el, tin, tout) => { el.style.transform = `translateY(${maskY(t, tin, tout) * 1.4}%)`; };
  fY(F_old, -1, 3.2); fY(F_new, 3.42, 7.7);
  show(F_old, t < 3.5); show(F_new, t >= 3.42 && t < 7.95);
  const nTyped = t < TYPE_T0 ? 0 : clamp(Math.floor((t - TYPE_T0) / TYPE_DT) + 1, 0, SLASH);
  F_typed.textContent = TYPED.slice(0, nTyped);
  fY(F_typed, -1, 10.02); show(F_typed, t >= TYPE_T0 && t < 10.3);
  fY(F_fixed, 10.22); show(F_fixed, t >= 10.22);

  // keys: fold out at 5.0, grow back at 7.7; presses while typing and on clicks
  keys.forEach(k => {
    let s;
    if (t < 7.6) s = 1 - ein((t - 5.0 - k.row * 0.03) / 0.2);
    else s = spr(t - 7.68 - (4 - k.row) * 0.035, 20, 0.85);
    let press = 0;

    }
    if (k.dataset.k === ' ' && t >= 10.0 && t < 10.14) press = 1;

    k.style.background = press ? '#DCE2E9' : '#fff';

  });

  });
  [abc, sett].forEach((e, i) => {
    const s = t < 7.5 ? spr(t - 5.5 - i * 0.04, 20, 0.85) : 1 - ein((t - 7.62) / 0.18);
    const press = (e === abc && t >= 7.5 && t < 7.62) ? 0.06 : 0;

  obj.style.width = o[2] + 'px'; obj.style.height = o[3] + 'px';
  obj.style.borderRadius = o[4] + 'px';
  const op = objAt(t - 1 / 60), opc = ctr(op);
  const ovx = Math.abs(oc[0] - opc[0]) * z, ovy = Math.abs(oc[1] - opc[1]) * z;
  const bx = Math.min(ovx * 0.15, 18) / z, by = Math.min(ovy * 0.15, 18) / z;

  obj.style.filter = (bx > 0.3 || by > 0.3) ? 'url(#ob)' : 'none';

  ovLabels.forEach((e, i) => {
    const r = L.tiles[i];
    const s = t < 7.5 ? spr(t - 5.5 - i * 0.03, 20, 0.85) : 1 - ein((t - 7.5 - i * 0.025) / 0.18);
    show(e, s > 0.01 && t > 5.5);
    e.style.left = r[0] + 'px'; e.style.top = r[1] + 'px'; e.style.width = r[2] + 'px'; e.style.height = r[3] + 'px';
    e.style.transform = `scale(${s})`;
    const on = oc[0] > r[0] && oc[0] < r[0] + r[2] && oc[1] > r[1] && oc[1] < r[1] + r[3];
    e.style.color = on ? '#fff' : INK;

  const nFix = t < TYPE_T0 ? 0 : clamp(Math.floor((t - TYPE_T0) / TYPE_DT) + 1 - SLASH, 0, 4);

  kbScroll.style.transform = `translateY(${-382 * K * eio((t - 19.55) / 0.9)}px)`;
  gal.forEach(([g, i]) => {
    const p = spr(t - 23.32 - Math.abs(i - 4) * 0.06, 18, 0.85);
    show(g, p > 0.01);
    g.style.transform = `scale(${0.6 + 0.4 * p})`;
    g.style.opacity = clamp(p);
  });

  // end: disc reveals the logo
  const lr = 150 * eout((t - 25.0) / 0.5);
  show(logo, t > 25.0);
  logo.style.clipPath = `circle(${lr}px at 50% 50%)`;
  setLine(E1, t, 25.5); setLine(E2, t, 26.0); setLine(E3, t, 26.5);

};
