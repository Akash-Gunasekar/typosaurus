# XcodeGen spec. On a Mac:  brew install xcodegen && cd ios && xcodegen && open Typosaurus.xcodeproj
# Set DEVELOPMENT_TEAM below (or in Xcode › Signing) before running on a device.
name: Typosaurus
options:
  bundleIdPrefix: com.example.typosaurus
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # The shared Kotlin core, built by Gradle into core/build/xcode-frameworks.
    FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../core/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
    OTHER_LDFLAGS: ["$(inherited)", "-framework", "TyposaurusCore"]

targets:
  Typosaurus:
    type: application
    platform: iOS
    sources:
      - Typosaurus
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.typosaurus
        INFOPLIST_FILE: Typosaurus/Info.plist
        CODE_SIGN_ENTITLEMENTS: Typosaurus/Typosaurus.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: TyposaurusKeyboard
        embed: true
    preBuildScripts:
      - name: Build shared Kotlin core
        script: |
          cd "$SRCROOT/.."
          ./gradlew -PcoreOnly=true :core:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false

  TyposaurusKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - TyposaurusKeyboard
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.typosaurus.keyboard
        INFOPLIST_FILE: TyposaurusKeyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: TyposaurusKeyboard/TyposaurusKeyboard.entitlements
    preBuildScripts:
      - name: Build shared Kotlin core
        script: |
          cd "$SRCROOT/.."
          ./gradlew -PcoreOnly=true :core:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
