name: CI
on:
  push:
    branches: [main]
    tags: ['v*'] # a version tag also publishes a GitHub Release with the APK
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint, unit tests (core, data, app), debug build
        run: ./gradlew lintDebug :core:jvmTest :data:testDebugUnitTest :app:testDebugUnitTest assembleDebug
      - name: Lock the release dependency graph for the scan
        run: |
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --write-locks -q
          test -s app/gradle.lockfile && wc -l app/gradle.lockfile
      - name: Dependency vulnerability scan (OSV)
        # Point the scanner at the lockfile explicitly; directory discovery found "no package sources".
        run: docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:latest scan source --lockfile /src/app/gradle.lockfile

  ios:
    # Compiles the shared Kotlin core for iOS and builds the SwiftUI app + keyboard for the simulator.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared core for iOS (framework)
        run: ./gradlew -PcoreOnly=true :core:linkDebugFrameworkIosSimulatorArm64
      - name: Generate Xcode project
        run: brew install xcodegen && cd ios && xcodegen
      - name: Build app + keyboard extension (simulator, unsigned)
        run: |
          cd ios
          xcodebuild -project Typosaurus.xcodeproj -scheme Typosaurus             -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'             CODE_SIGNING_ALLOWED=NO build

  instrumented:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: ./gradlew connectedDebugAndroidTest

  release:
    # Needs the upload-key secrets; turn on with the repo variable PLAY_RELEASE=true once they exist.
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && vars.PLAY_RELEASE == 'true'
    runs-on: ubuntu-latest
    needs: [unit, instrumented]
    permissions:
      contents: write # create the GitHub Release on version tags
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode upload keystore
        run: echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Build signed APK (direct download) and bundle (Play Store)
        env:
          UPLOAD_KEYSTORE: ${{ runner.temp }}/upload.jks
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/typosaurus.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/typosaurus.aab
          (cd dist && sha256sum typosaurus.apk typosaurus.aab > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with: { name: typosaurus-release, path: dist/* }
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/typosaurus.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "Typosaurus $GITHUB_REF_NAME" --generate-notes \
            --notes "Android: download **typosaurus.apk**, open it, and allow installing from your browser if asked. Then open Typosaurus to enable the keyboard. iOS: build from the ios/ folder (see README)."
